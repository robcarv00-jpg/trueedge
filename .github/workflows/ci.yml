name: TrueEdge CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: No placeholder URLs in app source
        run: |
          if grep -rn "carver.example" "${{ github.workspace }}/app/src/"; then
            echo "Placeholder URL found in app source - refusing to build."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Typecheck the whole app
        run: npx tsc --noEmit
      - name: Engine parity suite (must match the Python reference)
        run: npx tsc -p tsconfig.core.json && node tests/parity.mjs
